<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="KeyStroke — practise typing, drill real code, and race in multiplayer battles. Track WPM, accuracy and consistency with a streak that keeps you honest." />
    <meta name="theme-color" content="#f6f7f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d0a" media="(prefers-color-scheme: dark)" />
    <title>KeyStroke — type faster, code sharper</title>

    <!--
      Every icon below is generated from src/components/brand/Logo.jsx by
      `node scripts/build-icons.mjs`. This used to be a lone inline data-URI "k"
      that shared nothing with Logo.jsx, while public/favicon.svg and logo.svg
      were referenced by nothing at all — so editing the logo updated neither
      the tab nor the installed app, and the old mark stayed put.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Resolve the theme before first paint so there is never a flash of the wrong mode.
      (function () {
        try {
          var saved = localStorage.getItem('keystroke.theme');
          var mode =
            saved && saved !== 'system'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
