<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TypeForge — Type Faster. Play Harder.</title>
    <meta
      name="description"
      content="Master your keyboard. Drill prose and real code, race live opponents in the arena, duel forged rivals, and climb a leaderboard nobody can cheat."
    />
    <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />

    <!-- Open Graph / Twitter. The image is generated from the mark by
         `node scripts/build-icons.mjs`, so it cannot drift from the logo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TypeForge" />
    <meta property="og:title" content="TypeForge — Type Faster. Play Harder." />
    <meta
      property="og:description"
      content="Drill prose and real code, race live opponents in the arena, duel forged rivals, and climb a leaderboard nobody can cheat."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TypeForge — Type Faster. Play Harder." />
    <meta
      name="twitter:description"
      content="Drill prose and real code, race live opponents in the arena, duel forged rivals, and climb a leaderboard nobody can cheat."
    />
    <meta name="twitter:image" content="/og.png" />

    <!--
      Every icon below is generated from src/components/brand/Logo.jsx by
      `node scripts/build-icons.mjs`. This used to be a lone inline data-URI "k"
      that shared nothing with Logo.jsx, while public/favicon.svg and logo.svg
      were referenced by nothing at all — so editing the logo updated neither
      the tab nor the installed app, and the old mark stayed put.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      /**
       * Resolve the theme before first paint so there is never a flash of the
       * wrong mode.
       *
       * Reads the TypeForge key first and falls back to the KeyStroke one.
       * The fallback is not optional: the storage migration runs inside the
       * React bundle, which has not executed yet at this point, so on the
       * first load after upgrading an existing user's only saved preference
       * is still under the old namespace. Without this line they get one
       * frame of the wrong theme on exactly the load where the product is
       * trying to make its best impression.
       */
      (function () {
        try {
          var saved =
            localStorage.getItem('typeforge.theme') || localStorage.getItem('keystroke.theme');
          var mode =
            saved && saved !== 'system'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
