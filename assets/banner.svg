<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TypeForge — Type Faster. Play Harder.">
  <!-- ── Backdrop ─────────────────────────────────────────────────────── -->
  <rect width="1280" height="400" fill="#07080B"/>

  <!-- Dot grid, masked to fade toward centre -->
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#A78BFA" opacity="0.07"/>
    </pattern>
    <radialGradient id="glowWarm" cx="18%" cy="115%" r="75%">
      <stop offset="0%" stop-color="#FF7A2F" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#FF7A2F" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FF7A2F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCool" cx="88%" cy="-15%" r="70%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gradPlay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="45%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="topRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#FF7A2F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF7A2F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeGrid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="220" fill="url(#fadeGrid)"/></mask>
  </defs>

  <rect width="1280" height="220" fill="url(#dots)" mask="url(#gridMask)" opacity="0.9"/>
  <rect width="1280" height="400" fill="url(#glowWarm)"/>
  <rect width="1280" height="400" fill="url(#glowCool)"/>

  <!-- Specular rim -->
  <rect x="0" y="0" width="1280" height="1" fill="url(#topRim)"/>

  <!-- ── Mark ─────────────────────────────────────────────────────────── -->
  <g transform="translate(96,132)">
    <rect width="136" height="136" rx="30" fill="#FF7A2F"/>
    <g transform="scale(1.36) translate(-0,-0)">
      <path d="M45 16 L73 16 L59 84 L31 84 Z" fill="#0A0B0D"/>
      <path d="M23 55 L35 55 L29 84 L17 84 Z" fill="#0A0B0D"/>
    </g>
  </g>

  <!-- ── Wordmark + tagline ───────────────────────────────────────────── -->
  <text x="272" y="212" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="86" font-weight="700" letter-spacing="-3" fill="#F2F4F7">TypeForge</text>

  <text x="274" y="286" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="24" font-weight="500" letter-spacing="6" fill="#F2F4F7">TYPE FASTER.</text>
  <text x="540" y="286" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="24" font-weight="500" letter-spacing="6" fill="url(#gradPlay)">PLAY HARDER.</text>

  <!-- ── Footer strip ─────────────────────────────────────────────────── -->
  <line x1="274" y1="316" x2="1006" y2="316" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="274" y="344" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" letter-spacing="4" fill="#828C97">TYPING</text>
  <text x="372" y="344" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" letter-spacing="4" fill="#828C97" opacity="0.5">·</text>
  <text x="398" y="344" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" letter-spacing="4" fill="#828C97">CODE</text>
  <text x="480" y="344" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" letter-spacing="4" fill="#828C97" opacity="0.5">·</text>
  <text x="506" y="344" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" letter-spacing="4" fill="#828C97">BATTLE</text>
  <text x="1184" y="344" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" letter-spacing="3" fill="#828C97" text-anchor="end" opacity="0.7">THE NEXT GENERATION OF TYPING</text>
</svg>
